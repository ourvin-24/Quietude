<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artwork Detail - Quietude</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1 class="logo">Quietude</h1>
    <nav>
      <a href="index.html#gallery">Gallery</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <main class="detail-container">
    <a href="index.html#gallery" class="back-link">&larr; Back to Gallery</a>

    <div class="detail-content">
      <div class="art-preview">
        <img id="art-image" src="" alt="Artwork Detail">
      </div>
      
      <div class="art-details">
        <h2 id="art-title">Loading...</h2>
        <p id="art-meta" class="art-meta"></p>
        <div class="divider"></div>
        <p id="art-description" class="art-description"></p>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
